[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fxtensor-bayesnet"
version = "0.1.0"
description = "設定ファイル駆動の離散ベイジアンネットワーク推論ツール（fxtensor-salmon 使用）"
readme = "README.md"
requires-python = ">=3.8"
authors = [
  { name = "Tadachika Oki" },
]
classifiers = [
    "Private :: Do Not Upload",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "numpy>=1.20.0",
    "fxtensor-salmon>=1.2.2,<2",
]

[project.optional-dependencies]
plot = [
    "matplotlib>=3.5",
]
dev = [
    "pytest",
    "matplotlib>=3.5",
]

[project.scripts]
fxtensor-bayesnet = "fxtensor_bayesnet.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
