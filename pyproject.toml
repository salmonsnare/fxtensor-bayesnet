[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fxtensor-bayesnet"
version = "0.11.0"
description = "Config-driven inference for discrete Bayesian networks: scenario comparison, Bayesian updating, root-cause inference, do-interventions and causal effects, sensitivity analysis and daily snapshots (built on fxtensor-salmon)"
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Tadachika Oki", email = "sakesnare@gmail.com" },
]
keywords = [
    "bayesian-network", "probabilistic-graphical-model", "markov-kernel", "conditional-probability",
    "bayesian-inference", "scenario-analysis", "decision-support", "fxtensor",
    "causal-inference", "do-calculus", "sensitivity-analysis",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Natural Language :: Japanese",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "numpy>=1.20.0",
    "fxtensor-salmon>=1.2.2,<2",
]

[project.optional-dependencies]
plot = [
    "matplotlib>=3.5",
]
dev = [
    "pytest",
    "matplotlib>=3.5",
]

[project.urls]
Homepage = "https://github.com/salmonsnare/fxtensor-bayesnet"
Repository = "https://github.com/salmonsnare/fxtensor-bayesnet"
Issues = "https://github.com/salmonsnare/fxtensor-bayesnet/issues"
Changelog = "https://github.com/salmonsnare/fxtensor-bayesnet/blob/main/CHANGELOG.md"

[project.scripts]
fxtensor-bayesnet = "fxtensor_bayesnet.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
